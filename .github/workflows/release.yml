name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/tessera/__init__.py').read()).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}"
      - run: python -m pip install build pytest
      - run: python -m build
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl
          python -m pytest -p no:cacheprovider
          tessera --version
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
