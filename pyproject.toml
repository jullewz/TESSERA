[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-fim"
dynamic = ["version"]
description = "Tamper-evident filesystem integrity monitoring for Linux, macOS and Windows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jullewz" }]
maintainers = [{ name = "jullewz" }]
keywords = ["security", "integrity", "fim", "tripwire", "aide", "merkle", "intrusion-detection", "blue-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/jullewz/tessera"
Documentation = "https://github.com/jullewz/tessera/tree/main/docs"
Issues = "https://github.com/jullewz/tessera/issues"
Changelog = "https://github.com/jullewz/tessera/blob/main/CHANGELOG.md"

[project.scripts]
tessera = "tessera.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tessera.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tessera = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "N", "S", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "S603",    # subprocess without shell is the intended, safe pattern for hooks
    "S101",    # asserts are used for internal invariants
    "RUF001",  # unicode box-drawing characters are intentional
    "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLC0415", "N802"]
# Column lists are module constants and every value is bound as a parameter.
"src/tessera/store.py" = ["S608"]
"scripts/**" = ["S", "T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/tessera"]
